{% component 'siteSearchInclude' %}

<section class="container" id="work-packages" aria-labelledby="work-packages-heading">
    <h2 id="work-packages-heading" class="sr-only">Work packages</h2>

    <div class="row top-xs work_packages">
        {% for key, item in work_packages %}
        <article class="accordion-border key_{{key}}">
            <div class="row middle-xs accordion-toggle">
                <div class="col-xs-12 start-md start-xs"><div class="green_bullet">{{item.prefix}}</div></div>

                <div class="col-xs-12 start-xs title_container">{{item.title}}</div>

                <div class="col-xs-12 plusminus"><span class="plus">READ MORE</span></div>
            </div>

            <div class="accordion-content" style="display: none;">
                {{item.body|raw}}
            </div>
        </article>

        {% endfor %}
    </div>
</section>
